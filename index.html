<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' track.joverval.cl; style-src 'self' 'unsafe-inline'; connect-src 'self' https://relay.joverval.cl wss://relay.joverval.cl ws://localhost:* http://localhost:* https://track.joverval.cl; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; media-src 'none'">
  <title>p2p-collab-draw</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/style.css">
  <script src="/vendor/simplepeer.min.js"></script>
  <script data-goatcounter="https://track.joverval.cl/count" async src="https://track.joverval.cl/count.js"></script>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="topbar-group topbar-left">
    <span id="topbar-title" style="font-weight:600;color:#c9d1d9;">🎨 p2p-collab-draw</span>

    <div class="dropdown">
      <button class="icon-btn" id="file-menu-btn" title="File">📂</button>
      <div class="dropdown-menu" id="file-dropdown">
        <button id="save-svg-btn">💾 Save SVG</button>
        <button id="save-png-btn">🖼️ Save PNG</button>
        <button id="clear-canvas-btn">🗑️ Clear Canvas</button>
      </div>
    </div>

    <input id="email-input" data-testid="email-input" class="compact-input" placeholder="your@email.com">
    <button id="create-room-btn" data-testid="create-room-btn">Create Room</button>
    <span id="topbar-role" data-testid="role-label" style="font-size:12px;color:#8b949e;margin-left:4px;"></span>
    <button id="copy-invite-btn" data-testid="copy-invite-btn" class="handshake-btn" style="display:none;">📋 Copy invite</button>
    <span id="invite-copied" style="display:none;color:#3fb950;font-size:12px;">Copied!</span>
    <div class="dropdown">
      <button class="icon-btn" id="info-menu-btn" title="Connection info">ℹ️</button>
      <div class="dropdown-menu" id="info-dropdown">
        <div class="info-menu-section">
          <span class="info-menu-label">Room</span>
          <span id="info-room-id" class="info-menu-value">--</span>
        </div>
        <div class="info-menu-section">
          <span class="info-menu-label">Connection</span>
          <span id="info-connection-type" class="info-menu-value">--</span>
        </div>
        <hr class="info-menu-divider">
        <div class="info-menu-section" style="flex-direction:column;align-items:stretch;gap:6px;">
          <span class="info-menu-label">Manual connection</span>
          <input id="manual-answer-input" data-testid="answer-input" class="compact-input" placeholder="Paste answer...">
          <button id="manual-answer-btn" data-testid="apply-answer-btn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div style="flex:1;"></div>

  <div class="topbar-group topbar-right">
    <button class="icon-btn panel-btn" data-panel="info" title="How it works">ℹ️</button>
    <button class="icon-btn panel-btn" data-panel="users" title="Connected users">
      <span>👤</span>
      <span id="user-count">0</span>
    </button>
    <button class="icon-btn panel-btn has-notif" data-panel="chat" title="Chat">
      <span>💬</span>
      <span class="notif-dot" id="chat-notif"></span>
    </button>
  </div>
</div>

<!-- MAIN + PANEL -->
<div id="app-layout">
  <!-- LEFT TOOL PANEL -->
  <div id="left-panel">
    <div class="tool-section">
      <span class="tool-label">Tools</span>
      <div class="tool-btns">
        <button class="tool-btn active" data-tool="pencil" title="Pencil">✏️</button>
        <button class="tool-btn" data-tool="brush" title="Brush">🖌️</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">🧹</button>
      </div>
    </div>
    <div class="tool-section">
      <span class="tool-label">Shapes</span>
      <div class="tool-btns">
        <button class="tool-btn" data-tool="rect" title="Rectangle">⬜</button>
        <button class="tool-btn" data-tool="circle" title="Circle">⭕</button>
        <button class="tool-btn" data-tool="line" title="Line">📏</button>
      </div>
    </div>
    <div class="tool-section">
      <span class="tool-label">Fill</span>
      <div class="tool-btns">
        <button class="tool-btn" data-tool="fill" title="Fill Bucket">🪣</button>
      </div>
    </div>
    <div class="tool-section">
      <label class="tool-label" for="color-picker">Color</label>
      <input type="color" id="color-picker" value="#ffffff">
    </div>
    <div class="tool-section">
      <label class="tool-label" for="brush-size">Size <span id="brush-size-val">1</span></label>
      <input type="range" id="brush-size" min="1" max="40" value="1">
    </div>
  </div>

  <div id="main-content">
    <!-- Canvas: two SVG layers — background (committed) + foreground (in-progress stroke) -->
    <div id="canvas-section">
      <div id="canvas-stack" style="position:relative;width:100%;height:100%;">
        <svg id="bg-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#1e1e1e;border:1px solid #30363d;border-radius:4px;"></svg>
        <svg id="fg-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></svg>
      </div>
    </div>
  </div>

  <!-- UNIFIED RIGHT PANEL -->
  <div id="right-panel" class="panel-hidden">
    <div class="panel-header">
      <span id="panel-title">Panel</span>
      <button class="icon-btn" id="panel-close">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>

<!-- TOAST for pending requests -->
<div id="toast" data-testid="approval-toast" style="display:none;">
  <span id="toast-msg"></span>
  <div class="toast-btns">
    <button id="toast-approve" data-testid="approve-btn">Approve</button>
    <button id="toast-reject" data-testid="reject-btn" class="reject-btn">Reject</button>
  </div>
</div>

<!-- Hidden diagnostic spans -->
<span id="connection-route" data-testid="connection-route" style="display:none;"></span>
<span id="connection-state" data-testid="connection-state" style="display:none;"></span>
</body>
</html>
